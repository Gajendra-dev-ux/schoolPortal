{% extends 'core/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-center text-primary mb-4">🔑 पोर्टल पर लॉगिन करें</h3>
                
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    
                    <button type="submit" class="btn btn-primary w-100 mt-3">लॉगिन करें</button>
                </form>
                
                <div class="mb-3 text-end">
                    <a href="{% url 'forgot_password' %}" class="text-decoration-none small">पासवर्ड भूल गए? (Forgot Password)</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
