{% extends 'core/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-primary mb-4 fw-bold">🔒 पासवर्ड बदलें (Change Password)</h3>
                
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100 fw-bold">पासवर्ड सुरक्षित करें</button>
                </form>
                
                <div class="text-center mt-3">
                    <a href="{% url 'dashboard' %}" class="text-muted text-decoration-none">← डैशबोर्ड पर वापस जाएं</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
