{% extends 'core/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-danger mb-3 fw-bold">🔑 पासवर्ड रिकवरी (Forgot Password)</h3>
                <p class="text-muted small">अपना यूज़रनेम (Username) दर्ज करें।</p>
                
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">यूज़रनेम (Username)</label>
                        <input type="text" name="identifier" class="form-control" required placeholder="अपना स्कूल यूज़रनेम लिखें...">
                    </div>
                    <button type="submit" class="btn btn-dark w-100 fw-bold">पासवर्ड खोजें</button>
                </form>

                {% if message %}
                    <div class="alert alert-warning mt-3 mb-0 small">{{ message }}</div>
                {% endif %}
                
                <div class="text-center mt-3">
                    <a href="{% url 'login' %}" class="text-decoration-none">← लॉगिन पेज पर वापस जाएं</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
