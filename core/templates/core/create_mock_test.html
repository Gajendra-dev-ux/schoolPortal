{% extends 'core/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-9">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-primary mb-4">📝 मॉक टेस्ट डिज़ाइन करें (Multiple Questions)</h3>
                
                <form method="POST" id="testForm">
                    {% csrf_token %}
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">कक्षा चुनें (Class)</label>
                            <select name="school_class" class="form-select" required>
                                <option value="">-- क्लास चुनें --</option>
                                <option value="6th">Class 6th</option>
                                <option value="7th">Class 7th</option>
                                <option value="8th">Class 8th</option>
                                <option value="9th">Class 9th</option>
                                <option value="10th">Class 10th</option>
                                <option value="11th">Class 11th</option>
                                <option value="12th">Class 12th</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">विषय (Subject)</label>
                            <input type="text" name="subject" class="form-control" required placeholder="जैसे: गणित, विज्ञान">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">टेस्ट का शीर्षक (Test Title)</label>
                        <input type="text" name="title" class="form-control" required placeholder="जैसे: Chapter 1 Test">
                    </div>

                    <hr>
                    <h4 class="text-secondary mb-3">प्रश्न सूची (Questions List)</h4>
                    
                    <div id="questionsContainer">
                        <!-- Pehla Question Block -->
                        <div class="question-block card p-3 bg-light mb-3 border">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="fw-bold text-primary">प्रश्न 1</span>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">सवाल (Question Text)</label>
                                <textarea name="question_text" class="form-control" rows="2" required placeholder="यहाँ सवाल लिखें..."></textarea>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">प्रश्न का प्रकार</label>
                                    <select name="question_type" class="form-select" onchange="toggleOptions(this)">
                                        <option value="mcq">MCQ (Clickable Options)</option>
                                        <option value="subjective">Subjective / Written</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">अंक (Max Marks)</label>
                                    <input type="number" name="max_marks" class="form-control" value="1" required>
                                </div>
                            </div>

                            <!-- MCQ Fields & Correct Option Dropdown -->
                            <div class="mcq-options-container">
                                <div class="row g-2 mb-2">
                                    <div class="col-md-6"><input type="text" name="option_a" class="form-control" placeholder="Option A"></div>
                                    <div class="col-md-6"><input type="text" name="option_b" class="form-control" placeholder="Option B"></div>
                                </div>
                                <div class="row g-2 mb-2">
                                    <div class="col-md-6"><input type="text" name="option_c" class="form-control" placeholder="Option C"></div>
                                    <div class="col-md-6"><input type="text" name="option_d" class="form-control" placeholder="Option D"></div>
                                </div>
                                <div class="mb-2">
                                    <label class="form-label fw-bold text-success">सहि विकल्प चुनें (Correct Option):</label>
                                    <select name="correct_option" class="form-select w-50">
                                        <option value="A">Option A</option>
                                        <option value="B">Option B</option>
                                        <option value="C">Option C</option>
                                        <option value="D">Option D</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Add More Question Button -->
                    <button type="button" class="btn btn-outline-secondary w-100 mb-3 fw-bold" onclick="addQuestionField()">+ और प्रश्न जोड़ें (Add More Question)</button>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">टेस्ट पब्लिश करें</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
let questionCount = 1;

function addQuestionField() {
    questionCount++;
    const container = document.getElementById('questionsContainer');
    const newBlock = document.createElement('div');
    newBlock.classList.add('question-block', 'card', 'p-3', 'bg-light', 'mb-3', 'border');
    newBlock.innerHTML = `
        <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="fw-bold text-primary">प्रश्न ${questionCount}</span>
            <button type="button" class="btn btn-sm btn-danger" onclick="this.closest('.question-block').remove()">हटाएँ</button>
        </div>
        <div class="mb-3">
            <label class="form-label">सवाल (Question Text)</label>
            <textarea name="question_text" class="form-control" rows="2" required placeholder="यहाँ सवाल लिखें..."></textarea>
        </div>
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">प्रश्न का प्रकार</label>
                <select name="question_type" class="form-select" onchange="toggleOptions(this)">
                    <option value="mcq">MCQ (Clickable Options)</option>
                    <option value="subjective">Subjective / Written</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">अंक (Max Marks)</label>
                <input type="number" name="max_marks" class="form-control" value="1" required>
            </div>
        </div>
        <div class="mcq-options-container">
            <div class="row g-2 mb-2">
                <div class="col-md-6"><input type="text" name="option_a" class="form-control" placeholder="Option A"></div>
                <div class="col-md-6"><input type="text" name="option_b" class="form-control" placeholder="Option B"></div>
            </div>
            <div class="row g-2 mb-2">
                <div class="col-md-6"><input type="text" name="option_c" class="form-control" placeholder="Option C"></div>
                <div class="col-md-6"><input type="text" name="option_d" class="form-control" placeholder="Option D"></div>
            </div>
            <div class="mb-2">
                <label class="form-label fw-bold text-success">सहि विकल्प चुनें (Correct Option):</label>
                <select name="correct_option" class="form-select w-50">
                    <option value="A">Option A</option>
                    <option value="B">Option B</option>
                    <option value="C">Option C</option>
                    <option value="D">Option D</option>
                </select>
            </div>
        </div>
    `;
    container.appendChild(newBlock);
}

function toggleOptions(selectElem) {
    const container = selectElem.closest('.question-block').querySelector('.mcq-options-container');
    if(selectElem.value === 'subjective') {
        container.style.display = 'none';
    } else {
        container.style.display = 'block';
    }
}
</script>
{% endblock %}
